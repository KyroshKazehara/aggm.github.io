<!doctype html>
<html lang="pt-BR" data-t="vinho">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AGMM 2.0 v2 · All GameModes Modified</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap">
<style>
:root{--tx:#fff3f6;--mu:#e8c8d3;--ac:#ff9db6;--ac2:#ff5f8a;--ok:#9cf0c4;--wr:#ffd98a;font-family:Sora,system-ui,sans-serif}
[data-t=vinho]{--bg:#1a030c;--b1:#b3194f;--b2:#6e0b2e;--b3:#8a1b45}
[data-t=rose]{--bg:#3a0f22;--b1:#ff8fb3;--b2:#c23a6b;--b3:#e0638f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--tx);background:radial-gradient(520px 520px at 10% 6%,var(--b1),transparent 70%),radial-gradient(620px 620px at 92% 34%,var(--b2),transparent 70%),radial-gradient(520px 520px at 40% 100%,var(--b3),transparent 70%),var(--bg);background-attachment:fixed;transition:background .5s}
a{color:var(--ac)}:focus-visible{outline:2px solid #fff;outline-offset:3px}
.g{background:linear-gradient(135deg,#ffffff2e,#ffffff0d);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border:1px solid #ffffff38;box-shadow:inset 0 1px 0 #ffffff59,0 18px 40px #0000004d}
.m{color:var(--mu)}.btn{border:0;border-radius:99px;padding:11px 20px;min-height:44px;font:700 14px Sora,sans-serif;cursor:pointer;color:var(--tx);background:#ffffff1f;border:1px solid #ffffff40}
.btn.p{background:linear-gradient(180deg,#ffa9c0,var(--ac2));color:#2a0615;border:0}.btn.sm{min-height:36px;padding:6px 14px;font-size:12px}
.i{width:100%;min-height:44px;padding:10px 14px;border-radius:14px;border:1px solid #fff3;background:#00000040;color:var(--tx);font:14px Sora,sans-serif}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mu)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px auto 0;max-width:1100px;padding:10px 12px 10px 24px;border-radius:99px;width:calc(100% - 32px)}
.seg{display:flex;padding:4px;border-radius:99px}.seg button{border:0;background:none;color:var(--tx);font:600 13px Sora,sans-serif;padding:8px 16px;border-radius:99px;cursor:pointer;min-height:36px}.seg .on{background:#ffffff47}
main{max-width:1100px;margin:0 auto;padding:28px 16px 140px}
section[hidden]{display:none}h1{font-size:clamp(34px,6vw,58px);line-height:1.05;margin:0;font-weight:800}h2{margin:0 0 12px;font-size:22px}h3{margin:0 0 6px;font-size:17px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.card{border-radius:26px;padding:22px}
.hero{display:grid;gap:28px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:center;margin-bottom:28px}
.cap{height:200px;border-radius:20px;background:linear-gradient(135deg,#ffffff33,#0000004d) center/cover;margin-bottom:12px}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}.cd div{border-radius:16px;padding:12px 2px}.cd b{font-size:26px;display:block}.cd span{font-size:10px;color:var(--mu)}
.bar{height:8px;border-radius:99px;background:#ffffff24;overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .6s}
.tag{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:#ffffff26}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;border-radius:14px;background:#00000038;margin-bottom:8px;font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.tabs button{padding:9px 16px}
.dock{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;padding:8px;border-radius:99px;z-index:20;touch-action:none;user-select:none;transition:box-shadow .3s}
.dock button{position:relative;z-index:1;border:0;background:none;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 14px;min-width:60px;min-height:52px;font:600 10px Sora,sans-serif;cursor:pointer;border-radius:99px}
.dock svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bub{position:absolute;top:8px;bottom:8px;border-radius:99px;background:linear-gradient(135deg,#ffffff59,#ffffff1f);border:1px solid #ffffff80;box-shadow:inset 0 1px 0 #fff9,0 6px 18px #ff5f8a55;transition:left .4s cubic-bezier(.2,1.3,.4,1),width .3s;transform:scaleX(var(--sq,1)) scaleY(calc(2 - var(--sq,1)));pointer-events:none}
.dock.drag .bub{transition:width .2s}.dock.drag{box-shadow:inset 0 1px 0 #fff9,0 26px 60px #00000080}
.toast{position:fixed;top:84px;left:50%;transform:translate(-50%,-20px);padding:12px 22px;border-radius:99px;opacity:0;pointer-events:none;transition:.3s;z-index:30;font-size:14px}.toast.on{opacity:1;transform:translate(-50%,0)}
pre{margin:0;padding:12px;border-radius:14px;background:#0006;font:12px/1.7 ui-monospace,monospace;overflow:auto;white-space:pre-wrap}
@media(max-width:560px){.dock button{min-width:48px;padding:8px 8px}header{border-radius:28px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<h2>Nossas metas</h2><div class="grid"><div class="g card"><h3>Monetização na Twitch</h3><span class="m">US$ ${S.goals.tw[0]} de US$ ${S.goals.tw[1]}</span>${bar(...S.goals.tw)}</div><div class="g card"><h3>Monetização no YouTube</h3><span class="m">${S.goals.yt[0]} de ${S.goals.yt[1]} inscritos</span>${bar(...S.goals.yt)}</div></div>`,
funcs:()=>`<h2>Funções (${S.roles.length})</h2><div class="seg g" style="display:inline-flex;margin-bottom:16px">${['Todas','Impostor','Tripulante','Neutro'].map((t,i)=>`<button data-f="${t}" class="${(window.F||'Todas')===t?'on':''}">${t}</button>`).join('')}</div><div class="grid">${S.roles.filter(r=>(window.F||'Todas')==='Todas'||r.t===window.F).map(r=>`<article class="g card"><span class="tag">${E(r.t)}</span><h3 style="margin-top:10px">${E(r.n)}</h3><p class="m" style="margin:0;font-size:14px">${E(r.d)}</p></article>`).join('')}</div>`,
down:()=>`<h2>Downloads</h2><div class="grid"><div class="g card"><h3>PC · Steam (Windows)</h3><p class="m">Release ${E(S.release.v)} · DLL ${E(S.release.size)}</p><div style="display:grid;gap:10px"><a class="sb pk" href="${E(S.release.dll)}"><svg viewBox="0 0 24 24"><path d="${IC.down}"/></svg><span><b>Baixar DLL</b><small>Release ${E(S.release.v)} · ${E(S.release.size)}</small></span></a><a class="sb" href="${E(S.release.zip)}"><svg viewBox="0 0 24 24"><path d="${IC.down}"/></svg><span><b>Pacote Steam (.zip)</b><small>Instalação completa</small></span></a></div></div><div class="g card"><h3>Android · Launcher</h3><p class="m">ARM64 · Android 9+ · em breve</p><button class="btn" data-t="Vamos avisar quando o launcher sair.">Avisar quando sair</button></div></div>`,
idea:()=>`<h2>Sugira uma função</h2><form class="g card" id="fs" style="max-width:560px;display:grid;gap:12px"><label>Seu nome<input class="i" name="a" required maxlength="30"></label><label>Sua ideia<textarea class="i" name="x" required rows="4" maxlength="400"></textarea></label><button class="btn p">Enviar cartinha</button><p class="m" style="margin:0;font-size:12px">Só você e a equipe leem. Depois da moderação, as aceitas ficam públicas.</p></form>`,
bell:()=>`<h2>Updates</h2>${S.alerts.map(a=>`<div class="g card" style="margin-bottom:12px"><span class="tag">${E(a.d)}</span><h3 style="margin-top:10px">${E(a.t)}</h3><p class="m" style="margin:0">${E(a.m)}</p></div>`).join('')||'<p class="m">Nenhum alerta ainda.</p>'}`,
admin:()=>{const T=[['geral','Painel','Visão geral'],['roles','Conteúdo','Funções'],['cartas','Conteúdo','Cartinhas'],['rel','Conteúdo','Release e metas'],['alert','Comunidade','Alertas'],['aparencia','Sistema','Aparência'],['commit','Sistema','Commit']],n=pend().length;
const side=[...new Set(T.map(x=>x[1]))].map(g=>`<span class="gh">${g}</span>`+T.filter(x=>x[1]===g).map(([k,,l])=>`<button class="ni ${tab===k?'on':''}" data-tab="${k}">${l}${k==='cartas'?`<span class="tag">${S.cartas.filter(c=>c.s==='Recebida').length}</span>`:''}${k==='commit'?`<span class="tag">${n}</span>`:''}</button>`).join('')).join('');const cn=T.find(x=>x[0]===tab)[2];
return `<div class="adm"><aside class="g side"><strong style="padding:6px 12px 8px">AGMM Admin</strong>${side}</aside><div style="min-width:0"><div class="top"><div><span class="m" style="font-size:12px">Admin / ${cn}</span><h2 style="margin:0">${cn}</h2></div><div style="display:flex;gap:8px;align-items:center"><span class="g tag" style="padding:9px 14px">Kael · Dono</span><button class="btn sm p" data-tab="commit">Publicar · ${n}</button></div></div>${A[tab]()}</div></div>`}};
const series=(n,s=1)=>Array.from({length:n},(_,i)=>Math.round(30+20*Math.sin(i/4+s)+i*1.6+((i*7919+s*31)%11)));
const spark=d=>{const m=Math.max(...d);return `<svg viewBox="0 0 100 24" style="width:100%;height:26px" aria-hidden="true"><polyline fill="none" stroke="#ff9db6" stroke-width="2" points="${d.map((v,i)=>(i/(d.length-1)*100).toFixed(1)+','+(22-v/m*20).toFixed(1)).join(' ')}"/></svg>`};
const area=d=>{const w=640,h=180,m=Math.max(...d),p=d.map((v,i)=>(i?'L':'M')+(i/(d.length-1)*w).toFixed(1)+' '+(h-8-v/m*(h-24)).toFixed(1)).join('');return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img" aria-label="Gráfico de downloads por dia"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9db6" stop-opacity=".6"/><stop offset="1" stop-color="#ff9db6" stop-opacity="0"/></linearGradient></defs>${[0,1,2,3].map(i=>`<line x1="0" x2="${w}" y1="${8+i*(h-24)/3}" y2="${8+i*(h-24)/3}" stroke="#fff3"/>`).join('')}<path d="${p}L${w} ${h}L0 ${h}Z" fill="url(#ag)"/><path d="${p}" fill="none" stroke="#ff9db6" stroke-width="2.5" stroke-linejoin="round"/></svg>`};
const bars=(l,v)=>`<div style="display:grid;gap:10px">${l.map((x,i)=>`<div><div style="display:flex;justify-content:space-between;font-size:13px"><span>${x}</span><b>${v[i]}</b></div><div class="bar" style="margin:6px 0 0"><i style="width:${v[i]/Math.max(1,...v)*100}%"></i></div></div>`).join('')}</div>`;
const donut=(l,v)=>{const t=v.reduce((a,b)=>a+b,0)||1,C=['#ffd98a','#9cf0c4','#ff9db6'];let o=0;return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 42 42" width="120" role="img" aria-label="Cartinhas por status"><circle cx="21" cy="21" r="15.9" fill="none" stroke="#fff2" stroke-width="6"/>${v.map((x,i)=>{const a=x/t*100,r=`<circle cx="21" cy="21" r="15.9" fill="none" stroke="${C[i]}" stroke-width="6" stroke-dasharray="${a} ${100-a}" stroke-dashoffset="${25-o}"/>`;o+=a;return r}).join('')}</svg><div style="font-size:13px;display:grid;gap:4px">${l.map((x,i)=>`<span><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${C[i]};margin-right:6px"></i>${x}: ${v[i]}</span>`).join('')}</div></div>`};
const A={
geral:()=>{const ds=series(30),tot=ds.reduce((a,b)=>a+b,0),by=['Impostor','Tripulante','Neutro'].map(t=>S.roles.filter(r=>r.t===t).length),cs=['Recebida','Aceita','Recusada'].map(s=>S.cartas.filter(c=>c.s===s).length);
const k=(l,v,d,x='')=>`<div class="g card kpi"><span class="m">${l}</span><b>${v}</b><span class="dl">${d}</span>${x}</div>`;
return `<div class="grid4">${k('Downloads em 30 dias',tot,'dados de exemplo',spark(ds))}${k('Membros no Discord',106,'valor do site')}${k('Inscritos no YouTube',S.goals.yt[0],Math.round(S.goals.yt[0]/S.goals.yt[1]*100)+'% da meta')}${k('Cartinhas pendentes',cs[0],cs[1]+' aceitas')}</div>
<div class="g card"><h3>Downloads por dia <span class="tag">dados de exemplo</span></h3>${area(ds)}</div>
<div class="grid"><div class="g card"><h3>Funções por equipe</h3>${bars(['Impostor','Tripulante','Neutro'],by)}</div><div class="g card"><h3>Cartinhas por status</h3>${donut(['Recebida','Aceita','Recusada'],cs)}</div><div class="g card"><h3>Atividade recente</h3>${(S.log||[]).map(l=>`<div class="row" style="margin:0 0 6px"><span>${E(l.m)}</span><span class="m">${l.d}</span></div>`).join('')||'<p class="m" style="margin:0">As ações do painel aparecem aqui.</p>'}</div></div>`},
aparencia:()=>`<div class="g card" style="display:grid;gap:14px;max-width:560px"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-th="vinho">Tema vinho</button><button class="btn sm" data-th="rose">Tema rosé</button><button class="btn sm" data-pf="bg">Fundo com foto: ${P.bg?'ligado':'desligado'}</button><button class="btn sm" data-pf="cur">Mouse Among: ${P.cur?'ligado':'desligado'}</button></div><label>Desfoque da foto (${P.bl}px)<input type="range" id="bl" min="0" max="12" value="${P.bl}"></label></div>`,
roles:()=>`<form class="g card" id="fr" style="display:grid;gap:10px;margin-bottom:16px"><div class="grid"><label>Nome<input class="i" name="n" required></label><label>Equipe<select class="i" name="t"><option>Impostor</option><option>Tripulante</option><option>Neutro</option></select></label></div><label>Descrição<input class="i" name="d" required></label><button class="btn p" style="justify-self:start">Adicionar função</button></form>${S.roles.map((r,i)=>`<div class="row g"><span><b>${E(r.n)}</b> <span class="tag">${E(r.t)}</span></span><button class="btn sm" data-del="${i}">Remover</button></div>`).join('')}`,
cartas:()=>S.cartas.map((c,i)=>`<div class="row g"><span><b>${E(c.a)}</b> · <span class="m">${E(c.x)}</span></span><span style="display:flex;gap:6px;align-items:center"><span class="tag" style="color:${c.s==='Aceita'?'var(--ok)':c.s==='Recusada'?'var(--ac)':'var(--wr)'}">${c.s}</span>${c.s==='Recebida'?`<button class="btn sm p" data-cs="${i}|Aceita">Aceitar</button><button class="btn sm" data-cs="${i}|Recusada">Recusar</button>`:''}</span></div>`).join('')||'<p class="m">Nenhuma cartinha.</p>',
rel:()=>`<form class="g card" id="fe" style="display:grid;gap:10px"><div class="grid"><label>Versão<input class="i" name="v" value="${E(S.release.v)}"></label><label>Tamanho<input class="i" name="size" value="${E(S.release.size)}"></label></div><label>Link da DLL<input class="i" name="dll" value="${E(S.release.dll)}"></label><label>Link do pacote<input class="i" name="zip" value="${E(S.release.zip)}"></label><div class="grid"><label>YouTube atual<input class="i" name="yc" type="number" value="${S.goals.yt[0]}"></label><label>YouTube meta<input class="i" name="ym" type="number" value="${S.goals.yt[1]}"></label><label>Twitch atual (US$)<input class="i" name="tc" type="number" value="${S.goals.tw[0]}"></label><label>Twitch meta (US$)<input class="i" name="tm" type="number" value="${S.goals.tw[1]}"></label></div><button class="btn p" style="justify-self:start">Salvar alterações</button></form>`,
alert:()=>`<form class="g card" id="fa" style="display:grid;gap:10px;max-width:560px"><label>Título<input class="i" name="t" required></label><label>Mensagem<textarea class="i" name="m" rows="3" required></textarea></label><button class="btn p" style="justify-self:start">Publicar alerta</button></form>`,
commit:()=>{const k=pend();return `<div class="g card" style="display:grid;gap:12px"><h3>Alterações pendentes</h3><pre>${k.length?k.map(x=>`~ ${x}: ${E(JSON.stringify(BASE[x]).length)} → ${E(JSON.stringify(S[x]).length)} bytes`).join('\n'):'Nada para publicar.'}</pre><div class="grid"><label>Usuário/organização<input class="i" id="go" value="KyroshKazehara"></label><label>Repositório<input class="i" id="gr" value="aggm.github.io"></label><label>Arquivo<input class="i" id="gp" value="site-data.json"></label><label>Branch<input class="i" id="gb" value="main"></label></div><label>Token do GitHub (só fica na memória)<input class="i" id="gt" type="password" autocomplete="off"></label><label>Mensagem<input class="i" id="gm" value="feat: atualização pelo painel admin"></label><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn p" data-a="push">Commit e push</button><button class="btn" data-a="dl">Baixar site-data.json</button><button class="btn" data-a="rev">Reverter alterações</button></div></div>`}};
let render=()=>{$('#main').innerHTML=`<section>${V[cur]()}</section>`;tick()};
const json=()=>JSON.stringify(S,null,2);
/* acoes */
document.addEventListener('click',async e=>{const t=e.target.closest('[data-go],[data-tab],[data-del],[data-cs],[data-a],[data-f],button[data-t]');if(!t)return;const d=t.dataset;
 if(d.go)return go(d.go);if(d.t)return toast(d.t);if(d.f){window.F=d.f;return render()}if(d.tab){tab=d.tab;return render()}
 if(d.del!==undefined){S.roles.splice(+d.del,1);save();toast('Função removida.');return render()}
 if(d.cs){const[i,s]=d.cs.split('|');S.cartas[i].s=s;save();toast('Cartinha '+s.toLowerCase()+'.');return render()}
 if(d.a==='dl'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json()],{type:'application/json'}));a.download='site-data.json';a.click();return}
 if(d.a==='rev'){S=structuredClone(BASE);save();toast('Alterações revertidas.');return render()}
 if(d.a==='push'){const o=$('#go').value,r=$('#gr').value,p=$('#gp').value,b=$('#gb').value,tk=$('#gt').value;if(!tk)return toast('Cole um token do GitHub com permissão de escrita.');
  const u=`https://api.github.com/repos/${o}/${r}/contents/${p}`,H={Authorization:'Bearer '+tk,Accept:'application/vnd.github+json'};
  try{const g=await fetch(u+'?ref='+b,{headers:H});const sha=g.ok?(await g.json()).sha:undefined;
   const res=await fetch(u,{method:'PUT',headers:H,body:JSON.stringify({message:$('#gm').value,content:btoa(unescape(encodeURIComponent(json()))),branch:b,sha})});
   if(res.ok){BASE=structuredClone(S);localStorage.setItem('agmm2-base',JSON.stringify(BASE));toast('Commit enviado para '+b+'.');render()}else toast('GitHub recusou: erro '+res.status+'. Confira repositório, branch e token.')}catch{toast('Sem conexão com o GitHub.')}}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));
 if(f.id==='fs'){S.cartas.unshift({a:d.a,x:d.x,s:'Recebida'});save();f.reset();toast('Cartinha enviada. Obrigado!')}
 if(f.id==='fr'){S.roles.unshift(d);save();toast('Função adicionada.');render()}
 if(f.id==='fe'){S.release={v:d.v,size:d.size,dll:d.dll,zip:d.zip};S.goals={yt:[+d.yc,+d.ym||1],tw:[+d.tc,+d.tm||1]};save();toast('Release e metas salvas.');render()}
 if(f.id==='fa'){S.alerts.unshift({t:d.t,m:d.m,d:new Date().toLocaleDateString('pt-BR')});save();f.reset();toast('Alerta publicado em Updates.')}});
/* contagem */
const T0=new Date('2026-11-14T18:00:00-03:00');
function tick(){const c=$('#cd');if(!c)return;let s=Math.max(0,Math.floor((T0-Date.now())/1e3));const v=[[864e2,'dias'],[3600,'horas'],[60,'min'],[1,'seg']].map(([u,l])=>{const n=Math.floor(s/u);s-=n*u;return`<div class="g"><b>${String(n).padStart(2,'0')}</b><span>${l}</span></div>`});c.innerHTML=v.join('')}
setInterval(tick,1000);

addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;mx=e.clientX;my=e.clientY;cv.style.transform=`translate3d(${mx-3}px,${my-3}px,0)`;cv.style.opacity=1;mv=1;clearTimeout(mt);mt=setTimeout(()=>{mv=0;draw()},180);draw()},{passive:true});
addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){dn=1;draw()}});addEventListener('pointerup',()=>{dn=0;draw()});
document.addEventListener('mouseleave',()=>cv.style.opacity=0);addEventListener('blur',()=>cv.style.opacity=0);
setInterval(()=>{if(document.hidden||rm)return;fi=(fi+1)%16;draw()},90);draw();
const applyP=()=>{document.documentElement.dataset.bg=P.bg?1:0;document.documentElement.style.setProperty('--bl',P.bl+'px');document.documentElement.classList.toggle('cc',fine&&!!P.cur);$('#cv').style.display=fine&&P.cur?'':'none';
 $('#bgt').textContent=P.bg?'Fundo: foto':'Fundo: cor';$('#cst').textContent=P.cur?'Mouse: Among':'Mouse: padrão';try{localStorage.setItem('agmm2-pref',JSON.stringify(P))}catch{}};
applyP();
document.addEventListener('click',e=>{const t=e.target.closest('[data-th],[data-pf],#bgt,#cst');if(!t)return;if(t.dataset.th)setT(t.dataset.th);else{const k=t.dataset.pf||(t.id==='bgt'?'bg':'cur');P[k]=P[k]?0:1;applyP()}if(cur==='admin'&&tab==='aparencia')render()});
document.addEventListener('input',e=>{if(e.target.id==='bl'){P.bl=+e.target.value;applyP()}});

</script>
<script id="agmm-current-content" type="application/json">{"creations":[{"title":"Criomaníaco","team":"Impostor","description":"PRÉVIA · Matar congela em vez de eliminar. Colegas podem resgatar ao ficar perto por 2s; cada resgate custa uma das suas três vidas. Sem resgate em 15s, a vítima sofre um ataque. A terceira vida perdida causa sua morte. Recarga de congelamento configurável entre 5 e 20s. Reunião ou morte do dono descongela as vítimas. Sugestão: Random 🍃."},{"title":"Atômico","team":"Impostor","description":"PRÉVIA · Use Átomo ou o PET para plantar uma armadilha na sua posição. O primeiro inimigo a até 0,45 unidade sofre uma tentativa de eliminação, respeitando paredes e proteções. Uma armadilha por vez; duração de 15s e recarga de 35s por padrão. Vitória impostora. Sugestão: Zk."},{"title":"Militar","team":"Impostor","description":"PRÉVIA · Use Ataque Tático ou PET para marcar um inimigo próximo por 12s. Receba um aviso quando não houver outros jogadores por perto. Aproxime-se e ative outra vez para executar o alvo isolado. Recarga da marca: 30s. Paredes e escudos são respeitados. Sugestão: Zk."},{"title":"Cobradora","team":"Impostor","description":"PRÉVIA · Selecione um alvo em Cobrar ou use /cobrar ID. Ele recebe Matar temporariamente e tem 20s para eliminar alguém ou morrer; sua função e equipe originais são preservadas. Recarga: 35s. Não pode cobrar a mesma pessoa duas vezes seguidas. A cobrança termina ao conseguir um abate, morrer ou começar uma reunião. Sugestão: Supermoon36."},{"title":"Pacto da Morte da Comunidade","team":"Impostor","description":"EQUIPE: Impostor.\n\nMETAMORFOSE: selecione dois jogadores diferentes. Cada seleção tem prazo; sem o segundo alvo, a marca expira sem matar.\n\nPACTO: os dois marcados veem o símbolo um do outro e precisam se encontrar, sem parede entre eles, antes do prazo. Caso contrário, ambos sofrem um ataque. Escudos são respeitados.\n\nLIMITES: reunião, morte do dono ou de um alvo cancelam o pacto. Recarga começa ao terminar. O host configura prazo, distância, dutos, sabotagem e marcação de inimigos.\n\nSUGESTÃO: centilador."},{"title":"Amaldiçoador","team":"Impostor","description":"EQUIPE: Impostor.\n\nATIVAR: use o PET ou /habilidade perto de um adversário para aplicar a maldição. Apenas uma marca permanece ativa.\n\nPROTEÇÃO: você e seus companheiros impostores não conseguem eliminar diretamente a pessoa marcada enquanto você vive. Ela ainda pode ser expulsa ou eliminada por outra equipe.\n\nMALDIÇÃO: quando o marcado morre, um jogador vivo aleatório de outra equipe sofre um ataque que respeita escudos. Não atinge você nem seus aliados impostores. Não dispara se você já morreu.\n\nSUGESTÃO: zCoberta."},{"title":"Flexível","team":"Tripulante","description":"PRÉVIA · Cada tarefa concede uma ativação de Atravessar pelo duto/PET ou /habilidade. No cliente com mod, atravessa paredes por 5s; se terminar dentro de obstáculo, retorna ao último local seguro. No vanilla, faz um salto curto através da parede na direção de movimento, somente entre pontos seguros cadastrados. Visão inicial ampliada; ficar sem concluir tarefas a reduz gradualmente. Sugestão: Bezerra."},{"title":"Veterinário","team":"Tripulante","description":"PRÉVIA · PET ou /habilidade paralisa um impostor ou neutro próximo por 3s. Se um inimigo realmente matar outra pessoa perto de você, ele morre também. Se matar você, vira tripulante e perde acesso ao chat pelo resto da partida. Apenas abates confirmados ativam essas passivas. Sugestão: Bezerra."},{"title":"Lagado","team":"Tripulante","description":"PRÉVIA · Ataques diretos demoram 3s para eliminar você, sem avisar que há um ataque pendente. Use Reconectar pelo duto/PET ou /habilidade para cancelar a morte; 1 a 4 usos e recarga entre 20 e 45s. Anda mais devagar e ocasionalmente volta para uma posição recente e segura. Reuniões cancelam ataques pendentes. Sugestão: Random 🍃."},{"title":"Nezha","team":"Tripulante","description":"PRÉVIA · PET ou /habilidade aumenta a velocidade por 4s e deixa um rastro visual breve. Recarga: 30s. Uma vez por partida, durante uma reunião, /queimar ou a habilidade de reunião elimina todos os outros jogadores vivos que já votaram e concede vitória à tripulação. Não atinge abstinentes. Sugestão: SuperSonTuber27."},{"title":"Festejador","team":"Tripulante","description":"EQUIPE: Tripulante.\n\nATIVAR: use a habilidade ou PET dentro de uma sala para iniciar uma festa. Durante o efeito, impostores dentro daquela sala não conseguem matar pelo botão de eliminação.\n\nCONFIGURAÇÕES: recarga de 20 a 40 segundos; duração de 3 a 20 segundos. Uma festa por jogador.\n\nLIMITES: não protege de poderes indiretos, neutros ou expulsões. Reuniões e sua morte encerram a festa. Vence com os tripulantes.\n\nSUGESTÃO: lolzinpvp."},{"title":"Samurai","team":"Tripulante","description":"EQUIPE: Tripulante.\n\nATIVAR: use a habilidade ou PET para preparar uma defesa. Ela bloqueia uma tentativa direta de assassinato e informa se o golpe veio da esquerda, direita, de cima ou de baixo.\n\nLIMITES: uma defesa por ativação; recarga padrão de 45 segundos. Reuniões removem a defesa. Não protege contra votação nem efeitos que ignoram as defesas normais.\n\nVITÓRIA: complete tarefas e ajude os tripulantes a vencer.\n\nSUGESTÃO: Supermoon20."},{"title":"Ignorável","team":"Tripulante","description":"EQUIPE: Tripulante.\n\nATIVAR: use o botão de habilidade, PET ou /habilidade para ficar invisível durante 5 segundos. Reuniões, morte ou troca de função encerram a invisibilidade.\n\nPASSIVAS: votos contra você são recusados pelo host. Seu cadáver não pode ser reportado e desaparece nos clientes com mod.\n\nLIMITES: invisibilidade não concede escudo. Não mata, não sabota e não usa dutos. Vence com os tripulantes.\n\nSUGESTÃO: lolzinpvp."},{"title":"Xiao Yao","team":"Tripulante","description":"EQUIPE: Tripulante.\n\nATIVAR: use a habilidade ou PET para se teleportar até um ponto seguro próximo, entre 1 e 6 metros. O teleporte pode atravessar paredes; não escolhe pontos sobre obstáculos.\n\nECO: deixa uma marca espectral por 4 segundos no local de partida. A marca é visual e não realiza tarefas.\n\nLIMITES: cancela quando não há chegada segura. Recarga padrão de 30 segundos. Vence com os tripulantes.\n\nSUGESTÃO: Supermoon20."},{"title":"Fantasma de Poções","team":"Neutro","description":"PRÉVIA · Matar marca até dois jogadores; os espíritos tentam eliminá-los após 20s. Máximo de quatro abates próprios; a cada segundo abate, o corpo não pode ser reportado. PET revive uma vítima marcada próxima como aliado, ou prepara uma poção; /explodir usa a poção em área. Entrar no duto deixa um corpo real e permite retorno após 30s; reportar esse corpo impede o retorno. Contrato pelo painel de transformação exige eliminar o alvo em 60s ou morrer; a vítima remanescente fica amaldiçoada. Vence com seus aliados após abater e restarem até quatro tripulantes. Sugestão: 1d / ALTDZINN. Leia SURPRESA-2026-10-22.md para regras de integração e VIP."},{"title":"Depressivo","team":"Neutro","description":"PRÉVIA · É neutro, não tem tarefas ou botão de matar. Vence sozinho ao morrer, inclusive por votação. Desconectar não concede vitória. Sugestão: lolzinpvp."},{"title":"O Louco","team":"Neutro","description":"PRÉVIA · Após seu primeiro abate real, assume uma aparência aleatória sem animação, ganha velocidade 2x e recarga quase zero por 5s. Depois fica paralisado por 3s e lento por 5s. O efeito só acontece uma vez; depois volta aos abates normais, dutos e sabotagens. Vence como assassino neutro. Sugestão: Cianofobico."},{"title":"Dinossauro","team":"Neutro","description":"PRÉVIA · Rugido/PET paralisa jogadores próximos por 3s, com raio de 3 unidades e recarga de 30s. Morder tem recarga de 25s e respeita proteções. Não pode morder durante o rugido. Mortes próximas geram um aviso sem revelar o assassino. Vence sozinho ao conseguir quatro abates e restarem no máximo três vivos. Sugestão: Zk."},{"title":"Mestre das Armadilhas","team":"Neutro","description":"EQUIPE: Neutro.\n\nATIVAR: PET ou /habilidade coloca uma armadilha no chão. Ela arma após 1 segundo e imobiliza por 2 segundos o primeiro adversário que passar.\n\nVITÓRIA: sobreviva até prender cinco pessoas diferentes. Repetir a mesma vítima não aumenta o total.\n\nLIMITES: uma armadilha ativa; recarga padrão de 25 segundos. Reuniões e sua morte removem a armadilha. Não mata, não sabota e não usa dutos.\n\nSUGESTÃO: SuperGamerYT."},{"title":"Anti-Fobia","team":"Neutro","description":"EQUIPE: Neutro.\n\nATIVAR: PET ou /habilidade perto do alvo do Fóbico libera essa pessoa e provoca um novo sorteio entre outros tripulantes elegíveis.\n\nVITÓRIA: vença vivo se o Fóbico morrer ou for expulso. Se ele vencer enquanto você vive, você rouba sua vitória. Você também compartilha a vitória do jogador ciano se estiver vivo.\n\nLIMITES: não mata, não sabota e não usa dutos. Se não houver outro alvo elegível, o Fóbico aguarda.\n\nSUGESTÃO: lolzinpvp."},{"title":"Meia noite","team":"Outros","description":"PRÉVIA · Um governador enfrenta os cidadãos. Durante a sabotagem elétrica, todos podem matar; com a luz restaurada, os abates ficam bloqueados. O governador só sabota a luz, não usa dutos e recebe escudo temporário pelo PET ou botão Escudo. Cidadãos vencem eliminando o governador; ele vence sendo o último vivo. Recargas e escudo configuráveis. Sem reuniões ou fechamento de portas. Requer mapa com sabotagem elétrica. Sugestão de Bezerra."},{"title":"Jogos mortais","team":"Outros","description":"PRÉVIA · O host escolhe um desafio igual para todos. Todos concluem as tarefas primeiro. Tarefas: libera matar com recarga padrão de 5s. Dutos: após as tarefas, 20 entradas liberam matar com recarga de 2s e velocidade 3x. Abates: tarefas liberam matar com recarga de 10s; 5 abates dão velocidade 3x e recarga de 5s. Vence o último sobrevivente. Sem sabotagens, reuniões ou fechamento de portas. Metas, recargas e velocidade configuráveis. Sugestão de Cianofobico."},{"title":"Zé Botão","team":"Tripulante","description":"Ao usar a habilidade pelo duto ou PET, escolhe outro jogador vivo para relatar um corpo inexistente, sem matar ninguém. Tem de 1 a 2 usos configuráveis. Funciona com vanilla, que exibe o jogador escolhido como relator; clientes com mod ocultam a identidade na reunião."},{"title":"Imperador das Trevas","team":"Impostor","description":"Eclipse das Trevas reduz a visão dos tripulantes por 8 segundos, com recarga de 35 segundos. Passo Sombrio realiza um avanço curto sem atravessar paredes, com recarga de 25 segundos. Os poderes não funcionam simultaneamente. Vence com a equipe impostora."},{"title":"Ecolocalizador","team":"Tripulante","description":"Localizar rastreia todos os jogadores vivos por meio de setas. Duração configurável de 20 a 120 segundos e recarga de 5 a 60 segundos. O rastreamento termina na reunião ou na morte."},{"title":"Enderman","team":"Tripulante","description":"Teleporta para outra sala do mapa, com recarga de 20 a 40 segundos. /sala lista os destinos, /sala ID escolhe um e /sala aleatoria restaura o sorteio. Não usa corredores; cancela chegadas sem ponto seguro confirmado. Sabotagens bloqueiam o teleporte e o paralisam temporariamente."},{"title":"Jornalista","team":"Tripulante","description":"Use /divulgar TEXTO para enviar um aviso anônimo aos jogadores, incluindo vanilla, respeitando a recarga. Aceita até 160 caracteres, sem formatação HTML. A duração do aviso pode ser configurada de 5 a 20 segundos e a recarga de 15 a 120 segundos."},{"title":"Super Choque","team":"Tripulante","description":"Paralisa o alvo por 3 segundos por padrão. Se atingir outro tripulante, paralisa a si mesmo. Cada tarefa concede 0,5 ponto de habilidade por padrão e cada uso custa 1 ponto. Recarga padrão de 60 segundos; valores configuráveis."},{"title":"Mercenário da Comunidade","team":"Impostor","description":"Recebe uma vítima marcada. Eliminar o alvo correto reduz a recarga conforme configuração do host. Um ataque ao alvo errado é bloqueado por um escudo e avisa a vítima sobre a tentativa."},{"title":"O Trapper","team":"Impostor","description":"Coloca uma armadilha invisível no chão. Prende quem pisar nela por 4 segundos e bloqueia o reporte durante o efeito. Recarga padrão de 25 segundos e apenas uma armadilha ativa por vez."},{"title":"Assassino de Aluguel","team":"Neutro","description":"Recebe um alvo e só pode eliminá-lo. Tentar matar a pessoa errada provoca a própria morte. Após eliminar o alvo, recebe um novo contrato. Vence como assassino neutro; não pertence à equipe impostora."},{"title":"Coveiro","team":"Neutro","description":"Enterra corpos próximos, deixando um vestígio. Se outro jogador encontrar o local e revelar o corpo, perde o emprego e se torna tripulante. A ocultação de corpos exige todos os jogadores com mod."},{"title":"Pega-Pega Congelante","team":"Outros","description":"Um caçador precisa congelar todos os tripulantes. Congelados ficam imóveis e não podem fazer tarefas; colegas livres resgatam ao permanecer perto por 3 segundos. Os tripulantes vencem sobrevivendo 5 minutos com pelo menos um livre. Congelamento Total atinge jogadores próximos, com recarga padrão de 60 segundos."},{"title":"Sala Segura dos CLTs","team":"Outros","description":"Todos os tripulantes são CLTs e recebem uma sala como nome. Dentro dela, ficam verdes e protegidos; ao sair, ficam vermelhos e o escudo se desfaz em 3 segundos. Vencem concluindo tarefas. O host escolhe os impostores entre Espectro, Víbora, Metamorfo e Impostor normal. Sabotagem com recarga padrão de 45 segundos; portas bloqueadas."},{"title":"Coffez","team":"Tripulante","description":"PRÉVIA · Recebe pistas verdadeiras sobre impostores e verifica fatos registrados de abates e uso de dutos com /verificar ID matou sim|nao ou /verificar ID duto sim|nao. Tem três verificações por partida. Se um inimigo o matar diretamente, o assassino fica imobilizado por um instante."},{"title":"Fusca Azul","team":"Impostor","description":"PRÉVIA · Use Dirigir ou o PET para acelerar e atropelar por proximidade. A transformação tem duração e recarga configuráveis; um atropelamento bem-sucedido faz o motor engasgar por um instante. Paredes e proteções são respeitadas. Não usa dutos enquanto dirige."},{"title":"O Enganador","team":"Impostor","description":"PRÉVIA · Fantasma impostor que confunde tripulantes com três ilusões: alerta falso de reator, silhueta de um jogador vivo ou cegueira temporária. Use /ilusao 1|2|3 e Proteger, ou /ilusao ID N. Os efeitos são privados para o alvo; o reator falso não inicia uma sabotagem real."},{"title":"Contrabandista","team":"Impostor","description":"PRÉVIA · Transforma abates em moedas e abre uma loja para impostores enquanto está vivo. Com /c 1 até /c 5, compre velocidade, alcance, escudo, informação sobre uma função ou fuga para a saída de um duto após um abate. Tem desconto próprio; preços e recargas são configuráveis."},{"title":"Dublê","team":"Tripulante","description":"PRÉVIA · Use /i ID para assumir a função anterior de um tripulante morto. Não copia impostores, neutros ou fantasmas. Possui três usos por padrão, configuráveis até cinco, e mantém o comando e o saldo após cada troca."},{"title":"CLT","team":"Tripulante","description":"PRÉVIA · Recebe as tarefas longas disponíveis no mapa. Ao completar todas, desbloqueia habilidades de Engenheiro, Rastreador e Cientista. O PET ou /clt alterna a habilidade ativa, uma de cada vez, com recarga própria."},{"title":"Magnetizador","team":"Tripulante","description":"PRÉVIA · Cada tarefa concluída atrai a pessoa elegível mais próxima. Também pode interceptar ataques de impostores contra outras vítimas próximas: puxa a vítima e cancela o ataque, consumindo a recarga de resgate. Não transporta pessoas para dutos, escadas ou plataformas."},{"title":"Alvo Ampliado","team":"Outros","description":"PRÉVIA · Carta do Jogo de Cartas. O primeiro uso marca o alvo; os seguintes causam dano com alcance ampliado, inclusive através de paredes contra sua própria marca. /alvo ID permite atingir uma marca distante no vanilla. As marcas acabam na morte ou renascimento. Concede resistência configurável ao dano de Batida Sonora."},{"title":"Batida Sonora","team":"Outros","description":"PRÉVIA · Carta do Jogo de Cartas. Causa dano musical em área, aumentando com a quantidade de pessoas próximas e outras Batidas Sonoras equipadas no raio. Abates pela música ampliam o alcance até um limite configurável. Respeita paredes e escudos."},{"title":"Meta Víbora","team":"Impostor","description":"Combina a metamorfose com a habilidade de dissolver corpos. Use o disfarce para agir sem revelar sua identidade."},{"title":"Víbora Espectral","team":"Impostor","description":"Reúne metamorfose, dissolução de corpos e invisibilidade. Uma função para preparar o ataque e desaparecer."},{"title":"Arquiteto do Caos","team":"Impostor","description":"Instaurar Caos provoca efeitos aleatórios por 20 segundos, inverte controles e executa dois adversários durante a ativação."},{"title":"Abelha","team":"Impostor","description":"O botão de matar marca até três pessoas. Use o PET para executar as marcas. A reunião desfaz as marcações; não pode usar dutos."},{"title":"Leão","team":"Impostor","description":"Protege outros impostores com escudos e escolhe uma presa para a manada. Eliminar a presa concede benefícios ao caçador."},{"title":"Falsificador","team":"Impostor","description":"Seus corpos podem preparar armadilhas para quem reportar: silêncio, lentidão, voto em si, controles invertidos ou uma rara morte."},{"title":"Fênix","team":"Tripulante","description":"Após a primeira morte, aguarda o reporte do próprio corpo e o fim da reunião para voltar com uma espada. Deve vingar-se do assassino impostor antes do prazo; ao cumprir a vingança, descansa como Anjo da Guarda."},{"title":"Conjurador de Almas","team":"Neutro","description":"Marque um alvo pelo PET e encontre-o para eliminar em até 25 segundos. Vença ao completar quatro caçadas ou ser o último sobrevivente."},{"title":"Imaginador","team":"Neutro","description":"Por dez segundos, troca as aparências e os nomes vistos pelos demais jogadores. Ele enxerga a realidade. A ilusão termina na reunião e os nomes são restaurados. Elimine os adversários para vencer sozinho."},{"title":"Fóbico","team":"Neutro","description":"Recebe um alvo tripulante, sem escolher impostores ou neutros. Vence se o alvo elegível morrer ou for expulso. A saída do alvo da partida não concede vitória; um alvo inválido é substituído quando possível."},{"title":"Jogo de Cartas","team":"Outros","description":"Todos contra todos, com vida e renascimento. Use cartas de veneno, bomba, fogo, decomposição e outras habilidades. Vence quem terminar com mais abates."},{"title":"Jogo de Armas","team":"Outros","description":"Um confronto de todos contra todos com vida, abates e diferentes armas. Troque seu arsenal e busque a liderança."},{"title":"Gaming Cego","team":"Outros","description":"Uma forma diferente de jogar com configurações próprias de visão, proteção e habilidades. Consulte as opções do modo antes de iniciar."},{"title":"Padrão 2","team":"Outros","description":"Mantém as funções do mod em uma variante do modo padrão com eventos especiais. Descubra as diferenças durante a partida."},{"title":"Veneno","team":"Outros","description":"Envenena um alvo e causa dano periódico. Reaplicar renova a duração, sem somar camadas. Morte e renascimento removem o veneno. No Jogo de Cartas, equipe e use Conjurar carta ou Q (Matar no vanilla). Valores e recargas são configuráveis pelo anfitrião."},{"title":"Dano Instantâneo","team":"Outros","description":"Causa dano imediatamente no alvo. Não evolui com os abates. No Jogo de Cartas, equipe e use Conjurar carta ou Q (Matar no vanilla). Valores e recargas são configuráveis pelo anfitrião."},{"title":"Decomposição","team":"Outros","description":"Faz o corpo desaparecer aos poucos e reduz força e velocidade. A partir da segunda aplicação, a visão diminui progressivamente. Reaplicar não acumula lentidão nem renova a duração. O acúmulo zera no renascimento. No Jogo de Cartas, equipe e use Conjurar carta ou Q (Matar no vanilla). Valores e recargas são configuráveis pelo anfitrião."},{"title":"Bomba","team":"Outros","description":"Lança uma bomba na direção da mira. A explosão causa mais dano no centro, dano e empurrão na área externa. Paredes e escudos bloqueiam a explosão. Também pode atingir quem lançou. No Jogo de Cartas, equipe e use Conjurar carta ou Q (Matar no vanilla). Valores e recargas são configuráveis pelo anfitrião."},{"title":"Fogaréu","team":"Outros","description":"Aplica fogo acumulativo. Por padrão, cada camada causa 1% de dano por segundo durante 4 segundos. Abates finalizados pelo fogo aumentam permanentemente o dano e a duração na partida. No Jogo de Cartas, equipe e use Conjurar carta ou Q (Matar no vanilla). Valores e recargas são configuráveis pelo anfitrião."},{"title":"Dermatológico","team":"Outros","description":"Cura o próprio jogador. Por padrão, começa em 0,5% por uso e aumenta 0,02 ponto percentual por abate. Não ultrapassa a vida máxima. Com a vida cheia, não gasta a recarga. No Jogo de Cartas, equipe e use Conjurar carta ou Q (Matar no vanilla). Valores e recargas são configuráveis pelo anfitrião."},{"title":"Confusão","team":"Outros","description":"Causa dano, troca a carta do alvo e inverte temporariamente movimento, direção dos ataques e ordem de troca pelo PET. A seleção direta nos slots continua normal. No Jogo de Cartas, equipe e use Conjurar carta ou Q (Matar no vanilla). Valores e recargas são configuráveis pelo anfitrião."},{"title":"Espinho de Chão","team":"Outros","description":"Coloca uma área de espinhos na sua posição. Quem passar recebe dano periódico. Seus espinhos não machucam você. Há limites de áreas ativas e duração; paredes e escudos são respeitados. No Jogo de Cartas, equipe e use Conjurar carta ou Q (Matar no vanilla). Valores e recargas são confi     }
    return html.replace('gap:10px">', 'gap:10px">' + toolbar)
      .replace('<div class="grid"><label>YouTube atual', notes + '<div class="grid"><label>YouTube atual')
      .replaceAll('type="number"', 'type="number" min="0" step="any"');
  };

  document.addEventListener('change', event => {
    if (event.target.id !== 'steam-channel') return;
    const form = event.target.form;
    steamDrafts[steamChannel] = steamFormValues(form);
    steamChannel = event.target.value;
    showSteamFields(form);
    $('#steam-fetch-status').textContent = '';
  });

  function githubAssetUrl(asset, repository) {
    const prefix = 'https://github.com/' + repository + '/releases/download/';
    const url = asset?.browser_download_url;
    return typeof url === 'string' && url.startsWith(prefix) ? url : '';
  }

  document.addEventListener('click', async event => {
    const button = event.target.closest('#steam-fetch');
    if (!button || button.disabled) return;
    const form = button.form;
    const channel = steamChannel;
    const launcher = isLauncher(channel);
    const stable = channel === 'release' || channel === 'launcher-release';
    const repository = 'KyroshKazehara/' + (launcher ? 'AGMM---LAUNCHER' : 'AGMM---All-GameModes-Modified');
    const picker = form.querySelector('#steam-channel');
    const status = form.querySelector('#steam-fetch-status');
    const locked = [...form.elements].filter(field => !field.disabled);
    locked.forEach(field => field.disabled = true);
    status.textContent = 'Consultando GitHub…';

    try {
      const response = await fetch('https://api.github.com/repos/' + repository + '/releases?per_page=100', {
        credentials: 'omit', cache: 'no-store',
        headers: { Accept: 'application/vnd.github+json' },
        signal: AbortSignal.timeout(15000)
      });
      if (!response.ok) throw new Error('GitHub respondeu com HTTP ' + response.status + '.');
      const releases = await response.json();
      if (!Array.isArray(releases)) throw new Error('Resposta inesperada do GitHub.');
      const release = releases.filter(item => !item.draft && (stable
        ? !item.prerelease
        : item.prerelease && !/canary|dcle|dev/i.test(item.tag_name + ' ' + item.name)))
        .sort((a, b) => Date.parse(b.published_at) - Date.parse(a.published_at))[0];
      if (!release) throw new Error('Nenhuma versão publicada para este canal.');
      const assets = Array.isArray(release.assets) ? release.assets : [];
      const primaryPattern = launcher ? /\.apk$/i : /\.dll$/i;
      const secondaryPattern = launcher ? /^beta\.json$/i : /steam.*\.zip$/i;
      const primary = assets.find(asset => primaryPattern.test(asset.name));
      if (!githubAssetUrl(primary, repository)) {
        throw new Error('A versão encontrada ainda não tem ' + (launcher ? 'APK' : 'DLL') + ' oficial anexado.');
      }
      if (!form.isConnected || picker.value !== channel) return;
      steamDrafts[channel] = {
        v: release.tag_name.replace(/^v/i, ''),
        size: Number.isFinite(primary.size) ? (primary.size / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' MB' : '',
        dll: githubAssetUrl(primary, repository),
        zip: githubAssetUrl(assets.find(asset => secondaryPattern.test(asset.name)), repository),
        description: release.body || ''
      };
      showSteamFields(form);
      status.textContent = 'Versão ' + release.tag_name + ' importada. Confira os campos e salve para aplicar nesta cópia.';
    } catch (error) {
      status.textContent = error.message + ' Os campos foram mantidos.';
    } finally {
      locked.forEach(field => field.disabled = false);
    }
  });

  document.addEventListener('submit', event => {
    const form = event.target;
    if (form.id !== 'steam-release-form') return;
    event.preventDefault();
    if (form.querySelector('#steam-fetch').disabled) return;
    const version = steamFormValues(form);
    const validUrl = value => {
      if (!value) return true;
      try { return new URL(value).protocol === 'https:'; } catch { return false; }
    };
    if (!validUrl(version.dll) || !validUrl(version.zip)) {
      form.querySelector('#steam-fetch-status').textContent = 'Use links HTTPS para os downloads.';
      return;
    }
    const values = new FormData(form);
    if (isLauncher(steamChannel)) {
      S.release.launcher = { ...S.release.launcher, [steamChannel]: version };
    } else if (steamChannel === 'release') {
      S.release = { ...S.release, ...version };
    } else {
      S.release.beta = version;
    }
    S.goals = { yt: [+values.get('yc'), +values.get('ym') || 1], tw: [+values.get('tc'), +values.get('tm') || 1] };
    delete steamDrafts[steamChannel];
    save();
    toast('Release e metas salvas nesta cópia.');
    render();
  });


  const communityFrame = document.createElement('iframe');
  communityFrame.className = 'community-integration';
  communityFrame.title = 'Conta, sugestões e painel oficial do AGMM';
  communityFrame.hidden = true;
  const main = document.querySelector('main');
  const frameContainer = document.createElement('div');
  frameContainer.className = 'community-integration-container';
  frameContainer.hidden = true;
  frameContainer.append(communityFrame);
  main.after(frameContainer);

  const officialRoutes = {
    login: 'account',
    idea: 'suggestions',
    bell: 'updates'
  };
  let frameRoute = '';
  const localPreview = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);

  function syncCommunityTheme() {
    const root = communityFrame.contentDocument?.documentElement;
    if (root) root.dataset.t = document.documentElement.dataset.t;
  }

  let frameResize;
  function sizeCommunityFrame() {
    const body = communityFrame.contentDocument?.body;
    if (body && !frameContainer.hidden) communityFrame.style.height = Math.max(260, Math.ceil(body.getBoundingClientRect().height)) + 'px';
  }

  function openModeration() {
    const doc = communityFrame.contentDocument;
    doc?.querySelector('[data-workspace="moderation"]')?.click();
  }

  communityFrame.addEventListener('load', () => {
    syncCommunityTheme();
    frameResize?.disconnect();
    const body = communityFrame.contentDocument?.body;
    if (body) {
      frameResize = new ResizeObserver(sizeCommunityFrame);
      frameResize.observe(body);
      sizeCommunityFrame();
    }
    communityFrame.contentWindow?.addEventListener('hashchange', () => {
      if (!frameContainer.hidden) window.scrollTo({ top: 0, behavior: 'instant' });
    });
    communityFrame.contentWindow?.addEventListener('agmm:user-change', event => {
      if (event.detail.isCreator && !frameContainer.hidden && cur === 'admin' && tab === 'cartas') {
        communityFrame.contentWindow.location.hash = 'admin';
        openModeration();
      }
    });
    if (cur === 'admin' && tab === 'cartas') openModeration();
    if (!localPreview) return;
    const doc = communityFrame.contentDocument;
    const notice = doc?.getElementById('service-status');
    if (notice) {
      notice.hidden = false;
      notice.textContent = 'O login e o envio de sugestões estão disponíveis no domínio oficial do AGMM.';
    }
    doc?.addEventListener('submit', event => {
      event.preventDefault();
      event.stopImmediatePropagation();
    }, true);
  });
  new MutationObserver(syncCommunityTheme).observe(document.documentElement, {
    attributes: true, attributeFilter: ['data-t']
  });

  function showOfficial(route) {
    frameContainer.hidden = false;
    communityFrame.hidden = false;
    if (!frameRoute) {
      communityFrame.src = './comunidade.html#' + route;
    } else if (communityFrame.contentWindow.location.hash !== '#' + route) {
      communityFrame.contentWindow.location.hash = route;
    }
    frameRoute = route;
    sizeCommunityFrame();
  }

  function officialButton(route, label) {
    return '<button type="button" class="btn" data-community-route="' + route + '">' + label + '</button>';
  }

  V.login = () => '<h2>Login</h2>' +
    (location.protocol === 'file:'
      ? '<a class="btn p" href="' + accountUrl + '">Entrar no site oficial ↗</a>'
      : '<div id="community-slot"></div>');

  V.idea = () => '<h2>Ideias</h2>' +
    (location.protocol === 'file:'
      ? '<a class="btn p" href="' + accountUrl.replace('#account', '#suggestions') + '">Abrir sugestões oficiais ↗</a>'
      : '<div id="community-slot"></div>');

  const homeWithCommunity = V.home;
  V.home = () => homeWithCommunity().replace(
    '<a class="btn" href="' + accountUrl + '" target="_blank" rel="noopener noreferrer">Abrir conta ↗</a>',
    '<button class="btn" type="button" data-go="login">Abrir conta ↗</button>'
  );

  const updatesWithNotes = V.bell;
  V.bell = () => updatesWithNotes() +
    (location.protocol === 'file:' ? '' : '<div style="margin-top:14px">' +
      officialButton('updates', 'Alertas e notificações') + '</div><div id="community-slot"></div>');

  A.cartas = () => {
    if (location.protocol === 'file:') {
      return '<div class="g card"><h3>Cartinhas oficiais</h3>' +
        '<p class="m">Abra o painel no domínio oficial para carregar e moderar as cartinhas.</p>' +
        '<a class="btn p" href="' + accountUrl + '">Entrar no site oficial ↗</a></div>';
    }
    if (localPreview) {
      const tabs = labels => labels.map(label => '<button type="button" class="btn sm" disabled>' + label + '</button>').join('');
      return '<div class="g card"><h3>Cartinhas oficiais</h3>' +
        '<p class="m">Prévia da moderação. As cartinhas são carregadas no domínio oficial após o login do criador.</p>' +
        '<h3>Tipo</h3><div class="tabs">' + tabs(['Funções', 'Cartas', 'Modos de jogo', 'Outros']) + '</div>' +
        '<h3>Status</h3><div class="tabs">' + tabs(['Recebidas', 'Em análise', 'Aceitas', 'Arquivadas']) +
        '</div><a class="btn p" href="' + accountUrl + '" target="_blank" rel="noopener noreferrer">Entrar no site oficial ↗</a></div>';
    }
    return '<div id="community-slot"></div>';
  };

  A.commit = () => '<div class="g card"><h3>Publicação oficial</h3>' +
    '<p class="m">Entre com a conta do criador para abrir o painel protegido. ' +
    'Os dados salvos nesta prévia ficam neste navegador.</p>' +
    (location.protocol === 'file:'
      ? '<a class="btn p" href="' + accountUrl + '">Entrar no site oficial ↗</a>'
      : officialButton('account', 'Abrir conta e painel oficial')) +
    ' <button type="button" class="btn" data-a="dl">Baixar site-data.json</button></div><div id="community-slot"></div>';

  const renderWithCommunity = render;
  render = () => {
    frameContainer.hidden = true;
    renderWithCommunity();
    if (!document.getElementById('community-slot')) return;
    if (cur === 'login' || cur === 'idea') showOfficial(officialRoutes[cur]);
    if (cur === 'admin' && tab === 'cartas') {
      showOfficial('admin');
      openModeration();
    }
  };

  document.addEventListener('click', event => {
    const trigger = event.target.closest('[data-community-route]');
    if (!trigger) return;
    showOfficial(trigger.dataset.communityRoute);
    communityFrame.scrollIntoView({ block: 'nearest' });
  });

  async function loadOfficialSettings() {
    if (location.protocol === 'file:') return;
    try {
      const response = await fetch('./site-settings.json', {
        cache: 'no-store', credentials: 'omit', signal: AbortSignal.timeout(10000)
      });
      if (!response.ok) return;
      const settings = await response.json();
      const https = value => {
        try { return new URL(value).protocol === 'https:' ? value : ''; } catch { return ''; }
      };
      for (const [index, key] of ['android-release', 'android-beta'].entries()) {
        const version = settings.versions?.[key];
        if (https(version?.url) && typeof version.version === 'string') {
          content.android[index] = { ...content.android[index], ...version };
        }
      }
      for (const [channel, key] of [['release', 'pc-release'], ['beta', 'pc-beta']]) {
        const version = settings.versions?.[key];
        if (!https(version?.url) || typeof version.version !== 'string') continue;
        const published = { v: version.version.replace(/^v/i, ''), dll: version.url,
          zip: https(version.secondaryUrl), description: String(version.description || '') };
        if (channel === 'beta') {
          if (!S.release.beta) S.release.beta = { ...published };
          if (!BASE.release.beta) BASE.release.beta = { ...published };
        } else {
          for (const [field, value] of Object.entries(published)) {
            if (S.release[field] === DEF.release[field]) S.release[field] = value;
            if (BASE.release[field] === DEF.release[field]) BASE.release[field] = value;
          }
        }
      }
      for (const [name, key] of [['Discord', 'discord1'], ['YouTube', 'youtube'], ['Twitch', 'twitch'], ['TikTok', 'tiktok']]) {
        const url = https(settings.socialLinks?.[key]);
        if (url) content.socials[name] = url;
      }
      if (cur === 'down' || cur === 'home') render();
    } catch {
      // The bundled settings remain available without a connection.
    }
  }
  loadOfficialSettings();

  const savedPage = ld('agmm2-p');
  go(PG.some(([page]) => page === savedPage) ? savedPage : 'home');
})();

</script>
</body>
</html>
