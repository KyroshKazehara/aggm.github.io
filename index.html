<style>*{box-sizing:border-box}html{color-scheme:dark;background:#23040F}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px 20px;color:#FFF4F7;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 15% 12%,#FF657728,transparent 55%),radial-gradient(ellipse at 90% 90%,#FF455E18,transparent 50%),#23040F}main{width:min(100%,720px);text-align:center;padding:clamp(30px,7vw,64px) clamp(20px,5vw,52px);border:1px solid #FF657766;border-radius:30px;background:linear-gradient(145deg,#5D1735E8,#23040FF5);box-shadow:0 0 65px #FF455E24,inset 0 1px 0 #FFF4F72A}.brand{margin:0 0 12px;color:#FFE26B;font-size:12px;letter-spacing:.32em;font-weight:750}.hourglass{margin:24px 0 18px;font-size:clamp(58px,14vw,92px);line-height:1.3}h1{margin:0 auto;max-width:600px;font-size:clamp(28px,6.5vw,52px);font-weight:780;line-height:1.16;letter-spacing:-.04em;text-wrap:balance;color:#FFF4F7}.status{font-size:clamp(18px,4vw,23px);margin:24px 0 12px;color:#DDBDCA}.percentage{font-size:clamp(42px,10vw,64px);font-weight:760;letter-spacing:-.04em;color:#FFE26B;line-height:1.2}.track{height:7px;width:min(100%,280px);margin:20px auto 0;overflow:hidden;border-radius:999px;background:#FF657720;border:1px solid #FF657744}.fill{height:100%;width:1%;min-width:3px;border-radius:inherit;background:#FFE26B}footer{margin-top:32px;font-size:10px;letter-spacing:.16em;color:#DDBDCA}@media(max-height:520px){main{padding:20px}.hourglass{font-size:48px;margin:12px}.status{margin:14px 0 8px}footer{margin-top:20px}}
.hourglass{display:inline-block;transform-origin:50% 50%;animation:agmm-hourglass-turn 3s linear infinite;filter:drop-shadow(0 0 16px #FF455E44)}@keyframes agmm-hourglass-turn{to{transform:rotate(360deg)}}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}@media(prefers-reduced-motion:reduce){.hourglass{animation:none;transform:none}}</style>
